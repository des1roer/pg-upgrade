services:
  # ========== etcd (координатор) ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: pgupgrade-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    command: >
      /usr/local/bin/etcd
      --data-dir=/etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --listen-peer-urls http://0.0.0.0:2380
      --advertise-client-urls http://etcd:2379
      --initial-advertise-peer-urls http://etcd:2380
      --name etcd
      --initial-cluster etcd=http://etcd:2380
      --initial-cluster-state new
      --initial-cluster-token etcd-cluster-patroni
      --enable-v2
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped
    networks:
      - pg-cluster
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========== Patroni + PostgreSQL 17 (Node 1) ==========
  pg17:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: pgupgrade-pg17
    ports:
      - "5442:5432"
      - "8008:8008"
    environment:
      ETCD_HOST: etcd:2379
      SCOPE: dc1
      GROUP: postgresql
      EASY_INITDB: "admin:admin:mydb"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: superpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpass
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg17:5432
      PATRONI_POSTGRESQL_PARAMETERS: "max_connections=100,shared_buffers=128MB"
    volumes:
      - patroni-pg17-data:/home/postgres/pgdata
      - ./pg_hba.conf:/home/postgres/pgdata/pgroot/data/pg_hba.conf
    restart: unless-stopped
    depends_on:
      - etcd
    networks:
      - pg-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Patroni + PostgreSQL 17 (Node 2 — Replica) ==========
  pg17r:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: pgupgrade-pg17r
    ports:
      - "5443:5432"
      - "8009:8008"
    environment:
      ETCD_HOST: etcd:2379
      SCOPE: dc1
      GROUP: postgresql
      EASY_INITDB: "admin:admin:mydb"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: superpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpass
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg17r:5432
      PATRONI_POSTGRESQL_PARAMETERS: "max_connections=100,shared_buffers=128MB"
    volumes:
      - patroni-pg17r-data:/home/postgres/pgdata
      - ./pg_hba.conf:/home/postgres/pgdata/pgroot/data/pg_hba.conf
    restart: unless-stopped
    depends_on:
      - etcd
    networks:
      - pg-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8009/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Patroni + PostgreSQL 18 (Node 1) ==========
  pg18:
    image: ghcr.io/zalando/spilo-18:4.1-p2
    container_name: pgupgrade-pg18
    ports:
      - "5445:5432"
      - "8011:8008"
    environment:
      ETCD_HOST: etcd:2379
      SCOPE: dc2
      GROUP: postgresql18
      EASY_INITDB: "admin:admin:mydb"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: superpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpass
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg18:5432
      PATRONI_POSTGRESQL_PARAMETERS: "max_connections=100,shared_buffers=128MB"
    volumes:
      - patroni-pg18-data:/home/postgres/pgdata
      - ./pg_hba.conf:/home/postgres/pgdata/pgroot/data/pg_hba.conf
    restart: unless-stopped
    depends_on:
      - etcd
    networks:
      - pg-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8011/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Patroni + PostgreSQL 18 (Node 2 — Replica) ==========
  pg18r:
    image: ghcr.io/zalando/spilo-18:4.1-p2
    container_name: pgupgrade-pg18r
    ports:
      - "5446:5432"
      - "8012:8008"
    environment:
      ETCD_HOST: etcd:2379
      SCOPE: dc2
      GROUP: postgresql18
      EASY_INITDB: "admin:admin:mydb"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: superpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpass
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: pg18r:5432
      PATRONI_POSTGRESQL_PARAMETERS: "max_connections=100,shared_buffers=128MB"
    volumes:
      - patroni-pg18r-data:/home/postgres/pgdata
      - ./pg_hba.conf:/home/postgres/pgdata/pgroot/data/pg_hba.conf
    restart: unless-stopped
    depends_on:
      - etcd
    networks:
      - pg-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8012/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== pg_probackup (бекапы и миграция) ==========
  pgbackup:
    build:
      context: .
      dockerfile: Dockerfile.pgbackup
      args:
        PROBACKUP_PG_VERSION: "17"
        PROBACKUP_VERSION: "2.5.16"
    image: pgbackup:local
    container_name: pgupgrade-pgbackup
    hostname: pgbackup
    volumes:
      - ./backups:/backups
      - ./migration-scripts:/scripts:ro
      - ./pgbackup.conf:/etc/pgbackup.conf:ro
    environment:
      PGPASSWORD: superpass
      PGUSER: postgres
      PROBACKUP_BIN: pg_probackup-17
    networks:
      - pg-cluster
    restart: unless-stopped
    # В продакшене контейнер обычно запускается по расписанию/из bareos
    # Здесь держим в idle, чтобы exec'ить скрипты вручную
    command: ["tail", "-f", "/dev/null"]

  # ========== HAProxy (балансировка) ==========
  haproxy:
    image: haproxy:2.8
    container_name: pgupgrade-haproxy
    ports:
      - "5000:5000"   # PG17 Write → Master
      - "5001:5001"   # PG17 Read → Replicas
      - "5002:5002"   # PG18 Write → Master
      - "5003:5003"   # PG18 Read → Replicas
      - "7000:7000"   # Stats UI
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - pg17
      - pg17r
      - pg18
      - pg18r
    restart: unless-stopped
    networks:
      - pg-cluster

volumes:
  etcd-data:
  patroni-pg17-data:
  patroni-pg17r-data:
  patroni-pg18-data:
  patroni-pg18r-data:
  backups:

networks:
  pg-cluster:
    driver: bridge
