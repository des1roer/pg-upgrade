version: '3.8'

services:
  # ========== etcd (координатор) ==========
  etcd:
    image: quay.io/coreos/etcd:v3.5.16
    container_name: patroni-etcd
    ports:
      - "2379:2379"
      - "2380:2380"
    command: >
      /usr/local/bin/etcd
      --data-dir=/etcd-data
      --listen-client-urls http://0.0.0.0:2379
      --listen-peer-urls http://0.0.0.0:2380
      --advertise-client-urls http://etcd:2379
      --initial-advertise-peer-urls http://etcd:2380
      --name etcd
      --initial-cluster etcd=http://etcd:2380
      --initial-cluster-state new
      --initial-cluster-token etcd-cluster-patroni
      --enable-v2
    volumes:
      - etcd-data:/etcd-data
    restart: unless-stopped
    networks:
      - pg-cluster
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://localhost:2379", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========== Patroni + PostgreSQL Node 1 ==========
  postgresql1:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: patroni-pg1
    ports:
      - "5442:5432"
      - "8008:8008"
    environment:
      ETCD_HOST: etcd:2379
      SCOPE: dc1
      GROUP: postgresql
      EASY_INITDB: "admin:admin:mydb"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: superpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpass
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgresql1:5432
      PATRONI_POSTGRESQL_PARAMETERS: "max_connections=100,shared_buffers=128MB"
    volumes:
      - patroni-pg1-data:/home/postgres/pgdata
    restart: unless-stopped
    depends_on:
      - etcd
    networks:
      - pg-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Patroni + PostgreSQL Node 2 ==========
  postgresql2:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: patroni-pg2
    ports:
      - "5443:5432"
      - "8009:8008"
    environment:
      ETCD_HOST: etcd:2379
      SCOPE: dc1
      GROUP: postgresql
      EASY_INITDB: "admin:admin:mydb"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: superpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpass
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgresql2:5432
      PATRONI_POSTGRESQL_PARAMETERS: "max_connections=100,shared_buffers=128MB"
    volumes:
      - patroni-pg2-data:/home/postgres/pgdata
    restart: unless-stopped
    depends_on:
      - etcd
    networks:
      - pg-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== Patroni + PostgreSQL Node 3 ==========
  postgresql3:
    image: ghcr.io/zalando/spilo-17:4.0-p3
    container_name: patroni-pg3
    ports:
      - "5444:5432"
      - "8010:8008"
    environment:
      ETCD_HOST: etcd:2379
      SCOPE: dc1
      GROUP: postgresql
      EASY_INITDB: "admin:admin:mydb"
      PATRONI_SUPERUSER_USERNAME: postgres
      PATRONI_SUPERUSER_PASSWORD: superpass
      PATRONI_REPLICATION_USERNAME: replicator
      PATRONI_REPLICATION_PASSWORD: replpass
      PATRONI_POSTGRESQL_CONNECT_ADDRESS: postgresql3:5432
      PATRONI_POSTGRESQL_PARAMETERS: "max_connections=100,shared_buffers=128MB"
    volumes:
      - patroni-pg3-data:/home/postgres/pgdata
    restart: unless-stopped
    depends_on:
      - etcd
    networks:
      - pg-cluster
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8008/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========== HAProxy (балансировка) ==========
  haproxy:
    image: haproxy:2.8
    container_name: patroni-haproxy
    ports:
      - "5000:5000"   # Write → Master
      - "5001:5001"   # Read → Replicas
      - "7000:7000"   # Stats UI
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - postgresql1
      - postgresql2
      - postgresql3
    restart: unless-stopped
    networks:
      - pg-cluster

volumes:
  etcd-data:
  patroni-pg1-data:
  patroni-pg2-data:
  patroni-pg3-data:

networks:
  pg-cluster:
    driver: bridge
