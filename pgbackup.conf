# pgbackup.conf — конфигурация pg_probackup для миграции PG17 → PG18
# Подгружается в контейнер pgbackup

# Каталог для бекапов (общий volume)
BACKUP_DIR = /backups

# Экземпляр PG17 (source)
PG17_HOST = postgresql1
PG17_PORT = 5432
PG17_INSTANCE = pg17_cluster

# Экземпляр PG18 (target)
PG18_HOST = postgresql4
PG18_PORT = 5432
PG18_INSTANCE = pg18_cluster

# Параметры подключения
PGUSER = postgres
PGPASSWORD = superpass