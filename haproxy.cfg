global
  log stdout format raw local0

defaults
  log     global
  mode    tcp
  retries 2
  timeout client 30m
  timeout connect 4s
  timeout server 30m
  timeout check 5s

resolvers docker
  nameserver dns 127.0.0.11:53

# === Write → Master ===
frontend ft_write
  bind *:5000
  default_backend bk_write

# === Read → Replicas ===
frontend ft_read
  bind *:5001
  default_backend bk_read

# === Stats ===
frontend stats
  bind *:7000
  mode http
  stats enable
  stats uri /
  stats refresh 10s

# === Master backend (HTTP health check on Patroni REST API port 8008) ===
backend bk_write
  option httpchk
  http-check send meth GET uri /primary
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server pg1 postgresql1:5432 check port 8008 resolvers docker resolve-prefer ipv4
  server pg2 postgresql2:5432 check port 8008 resolvers docker resolve-prefer ipv4
  server pg3 postgresql3:5432 check port 8008 resolvers docker resolve-prefer ipv4

# === Replica backend (route reads to replicas only) ===
backend bk_read
  option httpchk
  http-check send meth GET uri /replica
  http-check expect status 200
  default-server inter 3s fall 3 rise 2 on-marked-down shutdown-sessions
  server pg1 postgresql1:5432 check port 8008 resolvers docker resolve-prefer ipv4
  server pg2 postgresql2:5432 check port 8008 resolvers docker resolve-prefer ipv4
  server pg3 postgresql3:5432 check port 8008 resolvers docker resolve-prefer ipv4
